name: Automotive Solution CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-build:
    name: Test, Lint & Build
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Code Quality & Lint Check
        run: npm run lint

      - name: Production Build Verification
        run: npm run build

  deploy-homelab:
    name: Deploy to Homelab Container
    needs: [lint-and-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Docker Service & Reload Nginx
        run: |
          echo "🚀 [CI/CD] Starting AutomotiveSolution Deployment on Homelab..."

          # 1. Pastikan hierarki direktori homelab tersedia
          mkdir -p /opt/apps/AutomotiveSolution
          mkdir -p /opt/homelab/compose/automotive-solution
          mkdir -p /opt/homelab/compose/nginx/conf.d

          # 2. Sinkronkan source code terbaru ke /opt/apps/AutomotiveSolution
          echo "📦 Syncing source code to /opt/apps/AutomotiveSolution..."
          rsync -a --delete --exclude '.git' ./ /opt/apps/AutomotiveSolution/

          # 3. Sinkronkan konfigurasi Compose & Nginx
          echo "⚙️ Syncing Compose and Nginx configs..."
          cp docker/compose.yml /opt/homelab/compose/automotive-solution/compose.yml
          cp docker/nginx-automotive.conf /opt/homelab/compose/nginx/conf.d/automotive.conf

          # 4. Build dan jalankan container baru
          echo "🐳 Building and updating container..."
          cd /opt/homelab/compose/automotive-solution
          docker compose up -d --build --remove-orphans

          # 5. Reload master Nginx reverse proxy
          echo "🌐 Reloading Master Nginx Proxy..."
          docker exec nginx nginx -s reload || true

          # 6. Verifikasi container aktif
          echo "🔍 Checking container status..."
          docker ps --filter "name=automotive-solution" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "✅ [CI/CD] AutomotiveSolution Deployed Successfully on Homelab!"
