name: Berkah Alam CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-build:
    name: Test, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Code Quality & Lint Check
        run: npm run lint

      - name: Production Build Verification
        run: npm run build

  deploy-homelab:
    name: Deploy to Homelab Container
    needs: [lint-and-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Docker Service & Reload Nginx
        run: |
          echo "🚀 [CI/CD] Starting Berkah Alam Deployment on Homelab..."

          # 1. Bersihkan service lama automotive-solution jika ada untuk mencegah konflik port & routing
          docker stop automotive-solution 2>/dev/null || true
          docker rm automotive-solution 2>/dev/null || true
          rm -f /home/storage/homelab/compose/nginx/conf.d/automotive.conf

          # 2. Pastikan hierarki direktori homelab tersedia
          mkdir -p /home/storage/apps/berkah-alam
          mkdir -p /home/storage/homelab/compose/berkah-alam
          mkdir -p /home/storage/homelab/compose/nginx/conf.d

          # 3. Sinkronkan source code terbaru ke /home/storage/apps/berkah-alam
          echo "📦 Syncing source code to /home/storage/apps/berkah-alam..."
          rsync -a --delete --exclude '.git' ./ /home/storage/apps/berkah-alam/

          # 4. Sinkronkan konfigurasi Compose & Nginx
          echo "⚙️ Syncing Compose and Nginx configs..."
          cp docker/compose.yml /home/storage/homelab/compose/berkah-alam/compose.yml
          cp docker/nginx-berkah-alam.conf /home/storage/homelab/compose/nginx/conf.d/berkah-alam.conf

          # 5. Build dan jalankan container baru
          echo "🐳 Building and updating container..."
          cd /home/storage/homelab/compose/berkah-alam
          docker compose up -d --build --remove-orphans

          # 6. Reload master Nginx reverse proxy
          echo "🌐 Reloading Master Nginx Proxy..."
          docker exec nginx nginx -s reload || true

          # 7. Verifikasi container aktif
          echo "🔍 Checking container status..."
          docker ps --filter "name=berkah-alam" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "✅ [CI/CD] Berkah Alam Deployed Successfully on Homelab!"
